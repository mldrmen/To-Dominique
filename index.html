<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Greeting Cards</title>
    <style>
        /* Blue and Pink Themed Background */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(to bottom, #99ccff, #ff99cc);
            overflow: hidden;
            position: relative;
            color: white;
            font-family: 'Arial', sans-serif;
            text-align: center;
        }

        /* Floating Hearts Animation */
        @keyframes floatingHearts {
            0% { transform: translateY(100vh) scale(0.5); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
        
        .heart {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: rgba(255, 182, 193, 0.7); /* Light pink hearts */
            clip-path: polygon(50% 0%, 100% 35%, 80% 100%, 50% 80%, 20% 100%, 0% 35%);
            animation: floatingHearts 5s linear infinite;
            opacity: 0.7;
        }

        /* Multiple hearts for animation */
        .heart:nth-child(1) { left: 10%; animation-duration: 6s; animation-delay: 0s; }
        .heart:nth-child(2) { left: 25%; animation-duration: 7s; animation-delay: 1s; }
        .heart:nth-child(3) { left: 50%; animation-duration: 8s; animation-delay: 2s; }
        .heart:nth-child(4) { left: 70%; animation-duration: 6s; animation-delay: 3s; }
        .heart:nth-child(5) { left: 90%; animation-duration: 7s; animation-delay: 4s; }

        .cards-container {
            display: flex;
            gap: 20px;
        }

        .card-container {
            position: relative;
            width: 300px;
            height: 200px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            transition: transform 1s;
        }

        .card.open {
            transform: rotateY(180deg);
        }

        .front, .inside {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: white;
            border: 3px solid #6699ff; /* Blue border */
            display: flex;
            justify-content: center;
            align-items: center;
            backface-visibility: hidden;
            font-size: 24px;
            font-weight: bold;
            color: #ff6699; /* Pink text */
        }

        .front {
            background-color: #99ccff; /* Light blue front */
        }

        .inside {
            transform: rotateY(180deg);
            text-align: center;
            padding: 20px;
        }

        .inside img {
            width: 100%;
            max-width: 300px;
            transition: transform 0.5s ease-in-out;
            cursor: pointer;
        }

        .fullscreen-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            display: none;
        }

        .fullscreen-container img {
            max-width: 90vw;
            max-height: 90vh;
        }
    </style>
</head>
<body>
    <h1>Happy Valentine's Day, My Love! 💙💖</h1>

    <div class="cards-container">
        <div class="card-container" onclick="toggleCard(0)">
            <div class="card" id="card0">
                <div class="front">I</div>
                <div class="inside">
                    <img src="image/bb.png" alt="Greeting Card 1" onclick="showFullscreen(this.src)">
                </div>
            </div>
        </div>
        <div class="card-container" onclick="toggleCard(1)">
            <div class="card" id="card1">
                <div class="front">Love</div>
                <div class="inside">
                    <img src="image/darkside.png" alt="Greeting Card 2" onclick="showFullscreen(this.src)">
                </div>
            </div>
        </div>
        <div class="card-container" onclick="toggleCard(2)">
            <div class="card" id="card2">
                <div class="front">You</div>
                <div class="inside">
                    <img src="image/yours.png" alt="Greeting Card 3" onclick="showFullscreen(this.src)">
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Hearts -->
    <div class="heart"></div>
    <div class="heart"></div>
    <div class="heart"></div>
    <div class="heart"></div>
    <div class="heart"></div>

    <div class="fullscreen-container" id="fullscreenContainer" onclick="hideFullscreen()">
        <img id="fullscreenImage" src="" alt="Fullscreen Image">
    </div>

    <script>
        function toggleCard(index) {
            let card = document.getElementById(`card${index}`);
            card.classList.toggle('open');
        }

        function showFullscreen(src) {
            let container = document.getElementById("fullscreenContainer");
            let image = document.getElementById("fullscreenImage");
            image.src = src;
            container.style.display = "flex";
        }

        function hideFullscreen() {
            document.getElementById("fullscreenContainer").style.display = "none";
        }
    </script>
</body>
</html>
